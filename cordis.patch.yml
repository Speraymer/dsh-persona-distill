# ============================================================================
# dsh-persona-distill —— DSH bundle patch（插件自带的挂载声明）
# ============================================================================
# 装上之后，profile 只要在 `dsh.profile.bundles` 里列出本包名即生效：
#
#   dsh plugin --profile web add dsh-persona-distill
#   （本地开发：dsh plugin --profile web add link:<插件目录>）
#
# 组成顺序：每个 bundle 的 patch 按 dsh.profile.bundles 顺序叠
#          → 再叠 profile 自己那一层的 cordis.patch.yml
# ============================================================================

- insert:
    - id: persona-distill
      name: dsh-persona-distill
      config:
        # 真正的用户配置在 <家>/persona-distill/config.json（设置页可改），这里只放默认值
        enabled: false
        runAt: '04:10'
